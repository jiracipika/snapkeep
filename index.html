    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://snapkeeper.vercel.app/#website",
            "url": "https://snapkeeper.vercel.app/",
            "name": "Snapkeep",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://snapkeeper.vercel.app/#app",
            "name": "Snapkeep",
            "url": "https://snapkeeper.vercel.app/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "description": "Turn your Snapchat data export into clean, dated photos and videos. Free, no sign-up, 100% in-browser — your Memories never leave your device.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "Clean, dated filenames for every photo and video",
              "Memories organized into year folders",
              "Automatic photo and video pair matching",
              "Original capture dates written back into EXIF and MP4 metadata",
              "100% local processing — nothing is uploaded",
              "Free to use, no sign-up required"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://snapkeeper.vercel.app/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is Snapkeep free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — Snapkeep is completely free to use. Non-invasive ads keep it running, and your archive is never uploaded, because it never leaves your device."
                }
              },
              {
                "@type": "Question",
                "name": "How do I export my Snapchat Memories?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "In Snapchat, go to Settings → My Data and request an export with Memories included. Snapchat emails you a download link for a ZIP — drop that file into Snapkeep and it does the rest."
                }
              },
              {
                "@type": "Question",
                "name": "Does Snapkeep upload my data anywhere?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Your ZIP is opened and processed entirely inside your browser. No file, photo, or video ever leaves your device."
                }
              },
              {
                "@type": "Question",
                "name": "Do you need my Snapchat username or password?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No — never. Snapkeep only reads the ZIP you already downloaded from Snapchat yourself. Any site asking for your Snapchat login to recover Memories is a phishing risk; Snapkeep never asks."
                }
              },
              {
                "@type": "Question",
                "name": "Why are some videos split into multiple files?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Snapchat exports longer videos as several consecutive MP4 parts. Snapkeep detects them, gives every photo and video a clean, dated filename, and organizes everything into year folders so you can find any Memory fast."
                }
              },
              {
                "@type": "Question",
                "name": "Do my photos and videos keep their original dates?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Snapkeep writes the original capture date back into each file’s metadata (EXIF for photos, MP4 for videos), so Memories sort correctly in Google Photos, Apple Photos, and your camera roll."
                }
              }
            ]
          }
        ]
      }
    </script>
