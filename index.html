<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Snapkeep turns your Snapchat data export into normal photos and videos you can actually keep — processed entirely on your device. Nothing is uploaded."
    />
    <meta name="theme-color" content="#f2d500" />
    <meta property="og:title" content="Snapkeep — Organize your Snapchat Memories" />
    <meta
      property="og:description"
      content="Turn your Snapchat data export into normal photos and videos you can actually keep. Processed entirely in your browser — nothing is uploaded."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Snapkeep — Organize your Snapchat Memories</title>
    <script>
      try {
        var t = localStorage.getItem('snapkeep-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
